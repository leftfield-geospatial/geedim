name: Test integration

on:
  workflow_dispatch:

jobs:
  test-pypi:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
        python-version: [ '3.11', '3.14' ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group tests
          python -m pip install --only-deps .
          python -m pip list

      - name: Run integration tests
        timeout-minutes: 10
        env:
          EE_SERVICE_ACC_PRIVATE_KEY: ${{ secrets.EE_SERVICE_ACC_PRIVATE_KEY }}
        run: |
          python -m pytest -v -n auto ./tests/integration.py

  test-conda:
    needs: test-pypi   # run after test-pypi to limit concurrent ee requests
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
        python-version: [ '3.11', '3.14' ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ matrix.python-version }}
          miniforge-version: latest
          activate-environment: geedim-test
          conda-solver: libmamba

      - name: Install dependencies
        run: |
          conda info
          conda install pytest pytest-xdist earthengine-api click rasterio tqdm tabulate fsspec aiohttp xarray
          conda list

      - name: Run integration tests
        timeout-minutes: 10
        env:
          EE_SERVICE_ACC_PRIVATE_KEY: ${{ secrets.EE_SERVICE_ACC_PRIVATE_KEY }}
        run: |
          python -m pytest -v -n auto ./tests/integration.py
